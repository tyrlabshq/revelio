<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revelio — Ingredient Grader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #fafafa;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 3rem 2.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .logo-name {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .tagline {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 3rem;
    }

    .links {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    .link-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      background: #f8f7ff;
      border: 1px solid #e0dcff;
      border-radius: 12px;
      padding: 1.6rem 2.2rem;
      text-decoration: none;
      color: #1a1a1a;
      transition: box-shadow 0.15s, transform 0.15s;
      min-width: 180px;
    }

    .link-card:hover {
      box-shadow: 0 4px 16px rgba(79,70,229,0.15);
      transform: translateY(-2px);
      text-decoration: none;
    }

    .link-icon {
      font-size: 2rem;
    }

    .link-title {
      font-size: 1rem;
      font-weight: 600;
      color: #4F46E5;
    }

    .link-desc {
      font-size: 0.85rem;
      color: #777;
    }

    .footer {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo">
      <div class="logo-icon">R</div>
      <span class="logo-name">Revelio</span>
    </div>

    <p class="tagline">Know what you're eating. Scan ingredients. Get the truth.</p>

    <div class="links">
      <a href="./privacy-policy.html" class="link-card">
        <span class="link-icon">🔒</span>
        <span class="link-title">Privacy Policy</span>
        <span class="link-desc">How we handle your data</span>
      </a>
      <a href="./support.html" class="link-card">
        <span class="link-icon">💬</span>
        <span class="link-title">Support</span>
        <span class="link-desc">FAQs &amp; contact us</span>
      </a>
    </div>

    <div class="footer">
      &copy; 2026 Ty Passalacqua &nbsp;&middot;&nbsp; Revelio v1.0
    </div>

  </div>
</body>
</html>
